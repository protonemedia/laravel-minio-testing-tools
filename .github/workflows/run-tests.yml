name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.6, 8.5, 8.4, 8.3]
        laravel: [13.*, 12.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      # MinIO no longer publishes binaries, so we build the last releases of
      # the server and client from source once and cache them for later runs.
      - name: Cache MinIO S3 server and client
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: ~/minio/bin
          key: minio-RELEASE.2025-10-15T17-29-55Z-mc-RELEASE.2025-08-13T08-35-41Z-${{ runner.os }}-${{ runner.arch }}

      - name: Setup Go
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install MinIO S3 server and client
        run: |
          if [ "${{ steps.minio-cache.outputs.cache-hit }}" != 'true' ]; then
            GOBIN=~/minio/bin CGO_ENABLED=0 go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
            GOBIN=~/minio/bin CGO_ENABLED=0 go install github.com/minio/mc@RELEASE.2025-08-13T08-35-41Z
          fi
          echo ~/minio/bin >> "$GITHUB_PATH"
          ~/minio/bin/minio --version
          ~/minio/bin/mc --version

      - name: Execute tests
        run: vendor/bin/pest
